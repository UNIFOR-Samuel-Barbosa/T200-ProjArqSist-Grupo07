spring.application.name=missao-marte-servidor

# Por padrão só aceita conexões da própria máquina. Para outra máquina da rede: SERVIDOR_ENDERECO=0.0.0.0 (use HTTPS).
server.address=${SERVIDOR_ENDERECO:127.0.0.1}
server.port=${SERVIDOR_PORTA:8080}

# H2 em arquivo; a pasta é trocada pela variável MISSAOMARTE_DADOS.
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/ajusta as tabelas sozinho. Em produção, usar migrações versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segredo do token: variável MISSAOMARTE_JWT_SEGREDO (>= 32 bytes). Sem ela, um segredo aleatório por execução.
missaomarte.jwt.segredo=${MISSAOMARTE_JWT_SEGREDO:}
missaomarte.jwt.validade=2h
